name: Build and Release Auto TDP

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Release DLL
        run: cmake --build build --config Release

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build/Release/version.dll dist/version.dll
          Copy-Item autotdp.ini dist/autotdp.ini
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath onex-auto-tdp-release.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onex-auto-tdp-release
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: OneXPlayer APEX Auto TDP v1.0
          tag_name: v1.0.0
          files: onex-auto-tdp-release.zip
          body: |
            ### OneXPlayer APEX - Auto TDP Proxy Release

            **Quick Install:**
            1. Download `onex-auto-tdp-release.zip` below and extract it.
            2. Copy `version.dll` and `autotdp.ini` directly into your `OneXConsole` folder (e.g. `C:\Program Files\OneXConsole\`).
            3. Start `OneXConsole.exe`, open the overlay, and drag the TDP slider once to calibrate.
            4. Done! On all future reboots, it activates automatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
