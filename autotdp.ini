[AutoTDP]
# Minimum wattage floor (for light desktop/2D gaming)
MinWatts=18

# Maximum wattage ceiling for Ryzen AI Max+ 395 / Strix Halo
MaxWatts=85

# GPU load threshold to trigger aggressive wattage scale-up (%)
TargetGpuLoadHigh=85

# GPU load threshold to trigger wattage scale-down (%)
TargetGpuLoadLow=65

# Wattage increment when GPU load is high
StepUpWatts=6

# Wattage decrement when GPU load is low for 3 consecutive intervals
StepDownWatts=2

# Polling frequency in milliseconds
PollIntervalMs=1000

# Open a debug console window showing live telemetry & DeviceIoControl logs (1 = yes, 0 = no)
EnableConsole=1

# --- PERSISTENT CALIBRATION (Auto-populated after moving the slider once) ---
CalibratedRva=0x0
CalibratedIoctl=0x0
WattOffset=-1
WattsInMilliwatts=0
BufferSize=0
BufferTemplateHex=
